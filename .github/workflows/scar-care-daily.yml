name: Publish Scar Care Daily

on:
  schedule:
    - cron: '15 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scar-care-daily
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate evidence-checked article
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BLOG_MODEL: gpt-6-astra
        run: npm run blog:generate

      - name: Verify production build
        run: npm run build

      - name: Commit a new article when generated
        run: |
          if git diff --quiet -- src/content/articles.json; then
            echo "No new article to commit."
            exit 0
          fi
          git config user.name "Scar Care Daily"
          git config user.email "actions@users.noreply.github.com"
          git add src/content/articles.json
          git commit -m "Publish Scar Care Daily for $(date -u +%F)"
          git push origin HEAD:main
